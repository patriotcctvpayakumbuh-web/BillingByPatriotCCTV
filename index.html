<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BILLING PATRIOT OKE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --border-color: #334155;
    --danger-color: #ef4444;
    --bg-color: #0f172a; 
    --card-bg: #1e293b;
    --accent-color: #38bdf8;
    --accent-hover: #0ea5e9;
    --danger-hover: #dc2626; 
    --success-color: #22c55e;
    --text-main: #f8fafc; 
    --text-muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
header h1 { color: var(--accent-color); font-size: 1.5rem; }
.auth-container { display: flex; align-items: center; gap: 12px; }
.user-info { font-size: 0.85rem; color: var(--text-muted); }
.btn-google { background-color: #ffffff; color: #1f2937; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
.logout-btn { background-color: var(--danger-color); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
#lockScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); max-width: 500px; margin: 40px auto; }
#lockScreen h2 { color: var(--accent-color); margin-bottom: 10px; font-size: 1.5rem; }
#lockScreen p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
#mainApp { display: none; max-width: 1200px; margin: 0 auto; }
.dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 900px) { .dashboard-grid { grid-template-columns: 2fr 1fr; } }
.tv-units-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); margin-bottom: 20px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
.card-header h2 { font-size: 1.1rem; color: var(--text-main); }
.status-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
.status-idle { background-color: #334155; color: var(--text-muted); }
.status-playing { background-color: var(--success-color); color: #fff; }
.form-group { margin-bottom: 10px; }
label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: var(--text-main); font-size: 0.9rem; }
input:focus, select:focus { outline: none; border-color: var(--accent-color); }
.preset-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.btn-preset { background-color: #334155; color: #f8fafc; border: none; padding: 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
.btn-preset:hover { background-color: var(--accent-color); color: #0f172a; }
.timer-display { text-align: center; font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: var(--accent-color); letter-spacing: 2px; }
.btn-group { display: flex; gap: 8px; margin-top: 10px; }
button.action-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
.btn-start { background-color: var(--accent-color); color: #0f172a; }
.btn-stop { background-color: var(--danger-color); color: #fff; }
.btn-fnb { background-color: var(--success-color); color: #fff; width: 100%; padding: 8px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; margin-top: 5px; }
.fnb-box { background-color: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 12px; }
.log-box { margin-top: 8px; font-size: 0.75rem; color: var(--text-muted); text-align: center; min-height: 16px; }
.finance-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat-box { background-color: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
.stat-box span { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
.stat-box h3 { font-size: 1rem; color: var(--success-color); }
.stat-box.expense h3 { color: var(--danger-color); }
.transaction-list { max-height: 280px; overflow-y: auto; font-size: 0.85rem; background-color: #0f172a; border-radius: 8px; padding: 10px; border: 1px solid var(--border-color); scroll-behavior: smooth; }
.transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #1e293b; }
.btn-delete { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; }
.error-msg { color: var(--danger-color); font-size: 0.85rem; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div id="lockScreen">
    <h2>Memeriksa sesi...</h2>
    <p>Silakan login menggunakan akun Google terdaftar.</p>
    <button class="btn-google" onclick="loginWithGoogle()">Login dengan Google</button>
    <div id="errorMsg" class="error-msg"></div>
</div>

<div id="mainApp">
    <header>
        <h1>BILLING PATRIOT OKE</h1>
        <div class="auth-container">
            <span class="user-info" id="userEmail"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>
    
    <div class="dashboard-grid">
        <div class="tv-units-container">
            <!-- Unit TV 01 -->
            <div class="card">
                <div class="card-header">
                    <h2>PS Unit 01</h2>
                    <span id="status-1" class="status-badge status-idle">SIAP IDLE</span>
                </div>
                <div class="form-group">
                    <label>IP TV:</label>
                    <input type="text" id="ip-1" value="192.168.1.5">
                </div>
                <div class="form-group">
                    <label>Paket Cepat:</label>
                    <div class="preset-buttons">
                        <button class="btn-preset" onclick="setPreset(1, 30)">30 mnt</button>
                        <button class="btn-preset" onclick="setPreset(1, 60)">1 jam</button>
                        <button class="btn-preset" onclick="setPreset(1, 120)">2 jam</button>
                        <button class="btn-preset" onclick="setPreset(1, 180)">3 jam</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Durasi (Menit):</label>
                    <input type="number" id="duration-1" value="60">
                </div>
                <div class="form-group">
                    <label>Harga (Rp):</label>
                    <input type="number" id="price-1" value="5000">
                </div>
                <div class="timer-display" id="timer-1">00:00:00</div>
                <div class="btn-group">
                    <button class="action-btn btn-start" onclick="startSession(1)">Mulai</button>
                    <button class="action-btn btn-stop" onclick="stopSession(1)">Selesai</button>
                </div>
                <div class="fnb-box">
                    <label>Tambah F&B Custom:</label>
                    <div class="form-group" style="margin-bottom:6px;">
                        <input type="text" id="fnb-name-1" placeholder="Nama Makanan/Minuman...">
                    </div>
                    <div class="form-group" style="margin-bottom:6px;">
                        <input type="number" id="fnb-price-1" placeholder="Harga (Rp)...">
                    </div>
                    <button class="btn-fnb" onclick="addFnB(1)">Catat F&B</button>
                </div>
                <div class="log-box" id="log-1">Siap</div>
            </div>
        </div>

        <!-- Panel Keuangan & Kas -->
        <div class="card">
            <div class="card-header">
                <h2>Laporan Kas & Omset</h2>
            </div>
            <div class="finance-stats">
                <div class="stat-box">
                    <span>Masuk</span>
                    <h3 id="totalIncome">Rp 0</h3>
                </div>
                <div class="stat-box expense">
                    <span>Keluar</span>
                    <h3 id="totalExpense">Rp 0</h3>
                </div>
            </div>
            <div class="form-group">
                <label>Filter Periode:</label>
                <select id="filterPeriod" onchange="loadTransactions()">
                    <option value="today">Hari Ini</option>
                    <option value="all">Semua Riwayat</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Pengeluaran:</label>
                <input type="text" id="expDesc" placeholder="Keterangan pengeluaran...">
                <input type="number" id="expAmount" placeholder="Nominal (Rp)..." style="margin-top: 5px;">
                <button class="btn-fnb" style="background-color: var(--danger-color); margin-top: 8px;" onclick="addExpense()">Catat Keluar</button>
            </div>
            <div class="form-group" style="margin-top: 20px;">
                <label>Riwayat (Auto-Scroll):</label>
                <div class="transaction-list" id="transactionList">
                    <div class="transaction-item">Memuat...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://scespkwtrcqvrslapkzc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Z-8KV50-kq4SeVQ4mYZOaQ_LBBfOZ1R';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const activeTimers = {};

    async function loginWithGoogle() {
        const { error } = await supabaseClient.auth.signInWithOAuth({ 
            provider: 'google', 
            options: { 
                redirectTo: window.location.origin + window.location.pathname,
                queryParams: { prompt: 'select_account' }
            } 
        });
        if (error) document.getElementById('errorMsg').innerText = error.message;
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    async function checkUserSession() {
        if (window.location.hash && window.location.hash.includes('access_token')) {
            try {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');
                if (accessToken) {
                    await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch (e) {
                console.error("Gagal memproses sesi hash:", e);
            }
        }

        let { data: { session } } = await supabaseClient.auth.getSession();

        if (session && session.user) {
            const { data: allowed, error } = await supabaseClient
                .from('allowed_users')
                .select('email')
                .eq('email', session.user.email)
                .maybeSingle();

            if (allowed) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('userEmail').innerText = session.user.email;
                loadTransactions();
                return;
            } else {
                await supabaseClient.auth.signOut();
                document.getElementById('errorMsg').innerText = "Akses Ditolak: Email " + session.user.email + " belum terdaftar di whitelist.";
            }
        }

        document.getElementById('lockScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('lockScreen').querySelector('h2').innerText = "Akses Terkunci";
    }

    window.addEventListener('DOMContentLoaded', () => {
        checkUserSession();
    });

    async function controlTV(unitId, action) {
        const ip = document.getElementById(`ip-${unitId}`).value;
        try {
            const response = await fetch('http://localhost:3000/api/adb', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip, action })
            });
            const result = await response.json();
            return result;
        } catch (err) {
            console.error("Gagal terhubung ke server lokal Termux:", err);
            return { success: false, message: "Gagal terhubung ke server Termux / ADB offline." };
        }
    }

    function setPreset(unitId, minutes) {
        document.getElementById(`duration-${unitId}`).value = minutes;
    }

    async function startSession(unitId) {
        const ip = document.getElementById(`ip-${unitId}`).value;
        const durationMin = parseInt(document.getElementById(`duration-${unitId}`).value) || 60;
        const price = parseInt(document.getElementById(`price-${unitId}`).value) || 0;
        const logBox = document.getElementById(`log-${unitId}`);

        if (!ip) {
            alert('Masukkan IP TV terlebih dahulu!');
            return;
        }

        logBox.innerText = "Menghubungkan ke ADB TV...";
        
        const res = await controlTV(unitId, 'wake');
        if (!res.success) {
            alert("GAGAL MENYALAKAN TV: TV tidak terhubung ke ADB / IP Salah (" + (res.message || 'Offline') + ")");
            logBox.innerText = "Gagal terhubung ke ADB";
            return;
        }

        document.getElementById(`status-${unitId}`).className = "status-badge status-playing";
        document.getElementById(`status-${unitId}`).innerText = "BERMAIN";
        logBox.innerText = "Sesi rental dimulai & TV aktif";

        await recordTransaction(`Rental PS Unit ${unitId} (${durationMin} Mnt)`, price, 'income');

        let totalSeconds = durationMin * 60;
        if (activeTimers[unitId]) clearInterval(activeTimers[unitId]);

        activeTimers[unitId] = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(activeTimers[unitId]);
                stopSession(unitId);
                logBox.innerText = "Waktu habis!";
                return;
            }
            totalSeconds--;
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            document.getElementById(`timer-${unitId}`).innerText = `${hrs}:${mins}:${secs}`;
        }, 1000);
    }

    async function stopSession(unitId) {
        if (activeTimers[unitId]) {
            clearInterval(activeTimers[unitId]);
            activeTimers[unitId] = null;
        }
        await controlTV(unitId, 'sleep');
        document.getElementById(`status-${unitId}`).className = "status-badge status-idle";
        document.getElementById(`status-${unitId}`).innerText = "SIAP IDLE";
        document.getElementById(`timer-${unitId}`).innerText = "00:00:00";
        document.getElementById(`log-${unitId}`).innerText = "Sesi dihentikan & Screensaver aktif";
    }

    async function addFnB(unitId) {
        const nameInput = document.getElementById(`fnb-name-${unitId}`);
        const priceInput = document.getElementById(`fnb-price-${unitId}`);
        
        const itemName = nameInput.value.trim();
        const itemPrice = parseFloat(priceInput.value);

        if (!itemName || isNaN(itemPrice) || itemPrice <= 0) {
            alert('Masukkan nama F&B dan harga dengan benar!');
            return;
        }

        await recordTransaction(`F&B Unit ${unitId}: ${itemName}`, itemPrice, 'income');
        nameInput.value = '';
        priceInput.value = '';
    }

    async function recordTransaction(description, amount, type) {
        const { error } = await supabaseClient.from('transactions').insert([{ description, amount, type }]);
        if (error) {
            alert('Gagal mencatat transaksi: ' + error.message);
        } else {
            loadTransactions();
        }
    }

    async function addExpense() {
        const desc = document.getElementById('expDesc').value.trim();
        const amount = parseFloat(document.getElementById('expAmount').value);
        if (!desc || isNaN(amount) || amount <= 0) {
            alert('Isi keterangan dan nominal pengeluaran dengan benar!');
            return;
        }
        await recordTransaction(desc, amount, 'expense');
        document.getElementById('expDesc').value = '';
        document.getElementById('expAmount').value = '';
    }

    async function loadTransactions() {
        const { data, error } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
        if (error) {
            console.error("Gagal memuat transaksi:", error);
            return;
        }

        let totalInc = 0;
        let totalExp = 0;
        let html = '';

        data.forEach(item => {
            if (item.type === 'income') totalInc += item.amount;
            else totalExp += item.amount;

            html += `
                <div class="transaction-item">
                    <span><b>${item.description}</b><br><small style="color:var(--text-muted);">${new Date(item.created_at).toLocaleTimeString('id-ID')}</small></span>
                    <span style="font-weight:bold; color:${item.type === 'income' ? 'var(--success-color)' : 'var(--danger-color)'}">
                        ${item.type === 'income' ? '+' : '-'} Rp ${item.amount.toLocaleString()}
                        <button class="btn-delete" onclick="deleteTransaction('${item.id}')" style="margin-left:8px;">Hapus</button>
                    </span>
                </div>
            `;
        });

        document.getElementById('totalIncome').innerText = `Rp ${totalInc.toLocaleString()}`;
        document.getElementById('totalExpense').innerText = `Rp ${totalExp.toLocaleString()}`;
        
        const listEl = document.getElementById('transactionList');
        listEl.innerHTML = html || '<div class="transaction-item">Belum ada transaksi</div>';
        listEl.scrollTop = 0;
    }

    async function deleteTransaction(id) {
        if (!confirm('Hapus catatan ini?')) return;
        const { error } = await supabaseClient.from('transactions').delete().eq('id', id);
        if (error) alert('Gagal menghapus: ' + error.message);
        else loadTransactions();
    }
</script>
</body>
</html>
